<!DOCTYPE html>
<html lang="ko" class="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Station</title>

    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&family=Noto+Sans+KR:wght@400;500;700&display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
        rel="stylesheet" />

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#00A79D",
                        "secondary": "#F5F5F5",
                        "accent": "#FFC107",
                        "text-primary": "#333333",
                        "text-secondary": "#666666",
                        "background-light": "#f6f8f8",
                        "background-dark": "#10221d",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans", "Noto Sans KR", "sans-serif"]
                    }
                },
            },
        }
    </script>

    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .animate-spin-custom {
            animation: spin 1s linear infinite;
        }

        body {
            font-family: "Plus Jakarta Sans", "Noto Sans KR", sans-serif;
            min-height: 100vh;
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .modal-enter {
            animation: fadeIn 0.2s ease-out forwards;
        }
    </style>
</head>

<body class="bg-background-light text-text-primary relative">

    <div id="app"></div>

    <!-- Firebase 모듈 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, deleteDoc, doc, updateDoc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // ==========================================
        // 1. Firebase 설정
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyBZvfs5PFT4BvbYnRd4ZkjQkmiVTy1Ov0A",
            authDomain: "withan-1120.firebaseapp.com",
            projectId: "withan-1120",
            storageBucket: "withan-1120.firebasestorage.app",
            messagingSenderId: "638498968442",
            appId: "1:638498968442:web:aaaf12d2385737254cfcc3",
            measurementId: "G-TBD9W8B634"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const COL_PRODUCTS = 'travel_products';
        const COL_COUNTRIES = 'travel_countries';
        const COL_REGIONS = 'travel_regions';

        // ==========================================
        // 2. 데이터 정의
        // ==========================================

        const ADMIN_PASSWORD_ENCODED = "MTIzMw==";
        const LOGO_IMAGE_URL = "https://www.naeiltour.co.kr/_Img/logo_naeiltour.png";
        const BANNER_IMAGE_URL = "https://www.naeiltour.co.kr/_Img/Main/search-menu-infree.png";

        const DEFAULT_COUNTRIES = [
            { id: 'vietnam', name: '베트남', nameEn: 'Vietnam', icon: '🇻🇳' },
            { id: 'thailand', name: '태국', nameEn: 'Thailand', icon: '🇹🇭' },
            { id: 'philippines', name: '필리핀', nameEn: 'Philippines', icon: '🇵🇭' },
        ];

        const DEFAULT_REGIONS = [
            { id: 'phuquoc', countryId: 'vietnam', name: '푸꾸옥', nameEn: 'Phu Quoc' },
            { id: 'danang', countryId: 'vietnam', name: '다낭', nameEn: 'Da Nang' },
            { id: 'nhatrang', countryId: 'vietnam', name: '나트랑', nameEn: 'Nha Trang' },
            { id: 'bangkok', countryId: 'thailand', name: '방콕', nameEn: 'Bangkok', badge: 'HOT' },
            { id: 'chiangmai', countryId: 'thailand', name: '치앙마이', nameEn: 'Chiang Mai' },
            { id: 'cebu', countryId: 'philippines', name: '세부', nameEn: 'Cebu' },
            { id: 'bohol', countryId: 'philippines', name: '보홀', nameEn: 'Bohol' },
        ];

        const INITIAL_SAMPLE_DATA = [
            {
                region: 'phuquoc',
                productName: "푸꾸옥 프라이빗 렌트카 투어",
                category: "투어",
                priority: 100,
                heroImage: "https://images.unsplash.com/photo-1586943101559-4cdcf86a6f87?auto=format&fit=crop&q=80&w=1000",
                operatingHours: "09:00 - 21:00",
                description: "우리끼리만 편안하게! 원하는 일정대로 자유롭게 이동하는 프라이빗 렌트카 서비스입니다.",
                pricingOptions: [
                    { id: 'opt1', name: '승용차 (4인승)', price: 60000, unit: '1대' },
                    { id: 'opt2', name: 'SUV (7인승)', price: 75000, unit: '1대' },
                ],
                policies: { cancellation: "이용일 2일 전까지 무료 취소 가능" },
                faq: [],
                inputFields: []
            },
            {
                region: 'danang',
                productName: "다낭 바나힐 일일 투어",
                category: "투어",
                priority: 90,
                heroImage: "https://images.unsplash.com/photo-1559592413-7cec4d0cae2b?auto=format&fit=crop&q=80&w=1000",
                operatingHours: "08:00 - 17:00",
                description: "거대한 손이 받치고 있는 골든 브릿지를 만나보세요.",
                pricingOptions: [{ id: 't1', name: '성인', price: 55000, unit: '1인' }],
                policies: {},
                faq: [],
                inputFields: []
            }
        ];

        // ==========================================
        // 3. 상태 관리
        // ==========================================

        const state = {
            currentUser: null,
            countries: [],
            regions: [],
            products: [],

            loading: true,
            isAdmin: false,
            showAuthModal: false,
            passwordInput: "",
            loginError: false,

            view: 'home',
            selectedCountry: null,
            selectedRegion: null,
            selectedProductId: null,

            viewData: null,
            isNewProduct: false,
            activeTab: 'info',
            deleteTargetId: null,

            adminTab: 'products',

            // Region Modal State
            isAddingRegion: false,
            editingRegionId: null,
            newRegionData: { countryId: '', name: '', nameEn: '' },

            // Country Modal State
            isAddingCountry: false,
            editingCountryId: null,
            newCountryData: { name: '', nameEn: '', icon: '✈️' },

            // Editor Region Search
            editorRegionSearch: "",

            searchQuery: "",
            selectedCategory: "전체",
            sortMode: "recommend",

            toast: { show: false, message: '', type: 'success' },
            initialLoadDone: false
        };

        const formatCurrency = (amount) => new Intl.NumberFormat('ko-KR').format(amount);
        function checkPassword(input) { return input && btoa(input.trim()) === ADMIN_PASSWORD_ENCODED; }
        function showToast(message, type = 'success') {
            state.toast = { show: true, message, type };
            render();
            setTimeout(() => { state.toast.show = false; render(); }, 4000);
        }

        function setState(callback, shouldRender = true) {
            callback(state);
            if (shouldRender) render();
        }

        let debounceTimer;
        function debounceRender() {
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(render, 300);
        }

        function getMinPrice(product) {
            if (!product.pricingOptions || !Array.isArray(product.pricingOptions)) return Infinity;
            const validPrices = product.pricingOptions.map(opt => Number(opt.price)).filter(p => p > 0);
            return validPrices.length === 0 ? Infinity : Math.min(...validPrices);
        }

        function getRegionProductCount(regionId) {
            return state.products.filter(p => (p.region || 'phuquoc') === regionId).length;
        }

        function getCountryProductCount(countryId) {
            const countryRegionIds = state.regions.filter(r => r.countryId === countryId).map(r => r.id);
            return state.products.filter(p => countryRegionIds.includes(p.region || 'phuquoc')).length;
        }

        // ==========================================
        // 4. Routing
        // ==========================================

        function safePushState(data, title, url) {
            try { history.pushState(data, title, url); } catch (e) { }
        }

        window.addEventListener('popstate', (event) => {
            const hash = window.location.hash;

            if (hash.startsWith('#product=')) {
                const id = hash.replace('#product=', '');
                const product = state.products.find(p => p.id === id);
                if (product) {
                    const region = state.regions.find(r => r.id === (product.region || 'phuquoc')) || state.regions[0] || {};
                    setState(s => {
                        s.view = 'detail';
                        s.selectedProductId = id;
                        s.selectedRegion = region.id;
                        s.selectedCountry = region.countryId;
                        s.viewData = JSON.parse(JSON.stringify(product));
                        s.activeTab = 'info';
                    });
                }
            } else if (hash.startsWith('#region=')) {
                const regionId = hash.replace('#region=', '');
                const region = state.regions.find(r => r.id === regionId);
                if (region) {
                    setState(s => {
                        s.view = 'product_list';
                        s.selectedRegion = regionId;
                        s.selectedCountry = region.countryId;
                        s.selectedProductId = null;
                    });
                }
            } else if (hash.startsWith('#country=')) {
                const countryId = hash.replace('#country=', '');
                setState(s => {
                    s.view = 'region_list';
                    s.selectedCountry = countryId;
                    s.selectedRegion = null;
                    s.selectedProductId = null;
                });
            } else if (hash === '#admin') {
                if (state.isAdmin) setState(s => { s.view = 'admin_dashboard'; });
                else { safePushState(null, '', ' '); setState(s => s.view = 'home'); }
            } else if (hash === '#new') {
                setState(s => { s.view = 'edit'; s.isNewProduct = true; });
            } else {
                setState(s => {
                    s.view = 'home';
                    s.selectedCountry = null;
                    s.selectedRegion = null;
                    s.selectedProductId = null;
                });
            }
        });

        // ==========================================
        // 5. Firebase Data Listeners
        // ==========================================

        const initAuth = async () => {
            try { await signInAnonymously(auth); }
            catch (e) { console.error(e); showToast("인증 실패", "error"); setState(s => s.loading = false); }
        };

        const subscribeToData = () => {
            onAuthStateChanged(auth, (user) => {
                state.currentUser = user;
                if (!user) return;

                onSnapshot(collection(db, COL_COUNTRIES), (snap) => {
                    const items = [];
                    snap.forEach(doc => items.push({ id: doc.id, ...doc.data() }));
                    items.sort((a, b) => a.name.localeCompare(b.name));
                    setState(s => s.countries = items);
                });

                onSnapshot(collection(db, COL_REGIONS), (snap) => {
                    const items = [];
                    snap.forEach(doc => items.push({ id: doc.id, ...doc.data() }));
                    items.sort((a, b) => a.name.localeCompare(b.name));
                    setState(s => s.regions = items);
                });

                onSnapshot(collection(db, COL_PRODUCTS), (snapshot) => {
                    const items = [];
                    snapshot.forEach((doc) => items.push({ id: doc.id, ...doc.data() }));
                    items.sort((a, b) => (b.priority || 0) - (a.priority || 0) || (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));

                    setState(s => {
                        s.products = items;
                        s.loading = false;

                        if (!s.initialLoadDone && s.regions.length > 0) {
                            const hash = window.location.hash;
                            if (hash === '#admin') { s.view = 'admin_dashboard'; }
                            else if (hash.startsWith('#product=')) {
                                const id = hash.replace('#product=', '');
                                const p = items.find(x => x.id === id);
                                if (p) {
                                    const r = s.regions.find(reg => reg.id === (p.region || 'phuquoc'));
                                    s.view = 'detail';
                                    s.selectedProductId = id;
                                    s.selectedRegion = r ? r.id : null;
                                    s.selectedCountry = r ? r.countryId : null;
                                    s.viewData = JSON.parse(JSON.stringify(p));
                                }
                            } else if (hash.startsWith('#region=')) {
                                const rid = hash.replace('#region=', '');
                                const r = s.regions.find(reg => reg.id === rid);
                                s.view = 'product_list';
                                s.selectedRegion = rid;
                                s.selectedCountry = r ? r.countryId : null;
                            } else if (hash.startsWith('#country=')) {
                                s.view = 'region_list';
                                s.selectedCountry = hash.replace('#country=', '');
                            }
                            s.initialLoadDone = true;
                        }

                        if (s.selectedProductId && s.view === 'detail' && !s.isAdmin) {
                            const updated = items.find(p => p.id === s.selectedProductId);
                            if (updated) s.viewData = JSON.parse(JSON.stringify(updated));
                        }
                    });
                });
            });
        };

        setTimeout(() => { if (state.loading) setState(s => s.loading = false); }, 5000);

        // ==========================================
        // 6. Actions
        // ==========================================
        window.actions = {
            toggleAuthModal: (show) => setState(s => s.showAuthModal = show),
            updatePasswordInput: (val) => { state.passwordInput = val; },
            handleAdminLogin: () => {
                if (checkPassword(state.passwordInput)) {
                    setState(s => { s.isAdmin = true; s.showAuthModal = false; s.passwordInput = ""; });
                    showToast("관리자 권한 획득");
                    actions.goAdminDashboard();
                } else {
                    setState(s => s.loginError = true);
                }
            },
            toggleAdminMode: () => {
                if (state.isAdmin) setState(s => s.isAdmin = false);
                else setState(s => s.showAuthModal = true);
            },

            goHome: () => {
                safePushState(null, '', ' ');
                setState(s => { s.view = 'home'; s.selectedCountry = null; s.selectedRegion = null; s.selectedProductId = null; });
            },
            goAdminDashboard: () => {
                safePushState({ view: 'admin' }, '', '#admin');
                setState(s => { s.view = 'admin_dashboard'; s.adminTab = 'products'; });
            },
            setAdminTab: (tab) => setState(s => s.adminTab = tab),

            selectCountry: (countryId) => {
                safePushState({ country: countryId }, '', `#country=${countryId}`);
                setState(s => { s.view = 'region_list'; s.selectedCountry = countryId; s.selectedRegion = null; });
            },
            selectRegion: (regionId) => {
                safePushState({ region: regionId }, '', `#region=${regionId}`);
                setState(s => { s.view = 'product_list'; s.selectedRegion = regionId; s.selectedProductId = null; s.searchQuery = ''; s.selectedCategory = '전체'; });
            },
            selectProduct: (id) => {
                const product = state.products.find(p => p.id === id);
                if (product) {
                    safePushState({ productId: id }, '', `#product=${id}`);
                    setState(s => { s.view = 'detail'; s.selectedProductId = id; s.viewData = JSON.parse(JSON.stringify(product)); });
                }
            },
            // [New] Tab Action
            setTab: (tab) => setState(s => s.activeTab = tab),

            back: () => {
                if (state.view === 'admin_dashboard') { actions.goHome(); return; }
                if (state.view === 'detail') {
                    if (state.selectedRegion) actions.selectRegion(state.selectedRegion);
                    else actions.goHome();
                    return;
                }
                if (state.view === 'product_list') {
                    if (state.selectedCountry) actions.selectCountry(state.selectedCountry);
                    else actions.goHome();
                    return;
                }
                if (state.view === 'region_list') { actions.goHome(); return; }
                if (state.view === 'edit') {
                    if (state.selectedProductId && state.selectedProductId !== 'temp') actions.selectProduct(state.selectedProductId);
                    else if (state.selectedRegion) actions.selectRegion(state.selectedRegion);
                    else if (state.isAdmin) actions.goAdminDashboard();
                    else actions.goHome();
                    return;
                }
                actions.goHome();
            },

            initializeMetadata: async () => {
                if (!confirm("국가/지역 기초 데이터를 DB에 생성하시겠습니까? (기존 데이터 유지)")) return;
                try {
                    for (const c of DEFAULT_COUNTRIES) {
                        const { id, ...data } = c;
                        await updateDoc(doc(db, COL_COUNTRIES, id), data).catch(async () => {
                            await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js").then(({ setDoc, doc }) => setDoc(doc(db, COL_COUNTRIES, id), data));
                        });
                    }
                    for (const r of DEFAULT_REGIONS) {
                        const { id, ...data } = r;
                        await updateDoc(doc(db, COL_REGIONS, id), data).catch(async () => {
                            await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js").then(({ setDoc, doc }) => setDoc(doc(db, COL_REGIONS, id), data));
                        });
                    }
                    showToast("기초 데이터 생성 완료");
                } catch (e) { console.error(e); showToast("초기화 실패", "error"); }
            },

            // Admin - Region Management
            openAddRegionModal: () => {
                setState(s => {
                    s.isAddingRegion = true;
                    s.editingRegionId = null;
                    s.newRegionData = { countryId: s.countries[0]?.id || '', name: '', nameEn: '' };
                });
            },
            openEditRegionModal: (id) => {
                const r = state.regions.find(reg => reg.id === id);
                if (!r) return;
                setState(s => {
                    s.isAddingRegion = true;
                    s.editingRegionId = id;
                    s.newRegionData = { countryId: r.countryId, name: r.name, nameEn: r.nameEn };
                });
            },
            closeAddRegionModal: () => setState(s => s.isAddingRegion = false),
            updateNewRegionData: (field, val) => setState(s => s.newRegionData[field] = val, false),
            saveNewRegion: async () => {
                const d = state.newRegionData;
                if (!d.name || !d.countryId) { showToast("지역명과 국가는 필수입니다.", "error"); return; }
                try {
                    const { setDoc, updateDoc, doc } = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js");

                    if (state.editingRegionId) {
                        // Edit Mode
                        await updateDoc(doc(db, COL_REGIONS, state.editingRegionId), d);
                        showToast("지역 정보가 수정되었습니다.");
                    } else {
                        // Add Mode
                        const id = d.nameEn ? d.nameEn.toLowerCase().replace(/\s+/g, '') : `reg_${Date.now()}`;
                        await setDoc(doc(db, COL_REGIONS, id), { ...d, id: id });
                        showToast("지역이 추가되었습니다.");
                    }
                    actions.closeAddRegionModal();
                } catch (e) { showToast("저장 실패: " + e.message, "error"); }
            },
            deleteRegion: async (id) => {
                if (getRegionProductCount(id) > 0) { showToast("이 지역에 등록된 상품이 있어 삭제할 수 없습니다.", "error"); return; }
                if (!confirm("정말 이 지역을 삭제하시겠습니까?")) return;
                try {
                    await deleteDoc(doc(db, COL_REGIONS, id));
                    showToast("삭제되었습니다.");
                } catch (e) { showToast("삭제 실패", "error"); }
            },

            // Admin - Country Management
            openAddCountryModal: () => {
                setState(s => {
                    s.isAddingCountry = true;
                    s.editingCountryId = null; // Reset edit ID
                    s.newCountryData = { name: '', nameEn: '', icon: '✈️' };
                });
            },
            openEditCountryModal: (id) => {
                const c = state.countries.find(cnt => cnt.id === id);
                if (!c) return;
                setState(s => {
                    s.isAddingCountry = true;
                    s.editingCountryId = id;
                    s.newCountryData = { name: c.name, nameEn: c.nameEn, icon: c.icon };
                });
            },
            closeAddCountryModal: () => setState(s => s.isAddingCountry = false),
            updateNewCountryData: (field, val) => setState(s => s.newCountryData[field] = val, false),

            saveNewCountry: async () => {
                const d = state.newCountryData;
                if (!d.name) { showToast("국가명은 필수입니다.", "error"); return; }
                try {
                    const { setDoc, updateDoc, doc } = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js");

                    if (state.editingCountryId) {
                        // Edit
                        await updateDoc(doc(db, COL_COUNTRIES, state.editingCountryId), d);
                        showToast("국가 정보가 수정되었습니다.");
                    } else {
                        // Add
                        const id = d.nameEn ? d.nameEn.toLowerCase().replace(/\s+/g, '') : `cnt_${Date.now()}`;
                        await setDoc(doc(db, COL_COUNTRIES, id), { ...d, id: id });
                        showToast("국가가 추가되었습니다.");
                    }
                    actions.closeAddCountryModal();
                } catch (e) { showToast("저장 실패: " + e.message, "error"); }
            },
            deleteCountry: async (id) => {
                const hasRegions = state.regions.some(r => r.countryId === id);
                if (hasRegions) { showToast("이 국가에 등록된 지역이 있어 삭제할 수 없습니다.", "error"); return; }
                if (!confirm("정말 이 국가를 삭제하시겠습니까?")) return;
                try {
                    await deleteDoc(doc(db, COL_COUNTRIES, id));
                    showToast("삭제되었습니다.");
                } catch (e) { showToast("삭제 실패", "error"); }
            },

            // Product CRUD
            addProduct: () => {
                // const defaultRegion = state.selectedRegion || (state.regions[0]?.id); // [기존 코드 주석]
                // [변경] 신규 등록 시 검색창이 바로 보이도록 빈 값("")으로 초기화
                const newProduct = {
                    region: "",
                    productName: "",
                    heroImage: "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&q=80&w=1000",
                    category: "투어",
                    priority: 0,
                    operatingHours: "09:00 - 18:00",
                    description: "",
                    pricingOptions: [],
                    policies: { cancellation: "" },
                    faq: [],
                    inputFields: []
                };
                safePushState({ mode: 'new' }, '', '#new');
                setState(s => { s.view = 'edit'; s.viewData = newProduct; s.selectedProductId = 'temp'; s.isNewProduct = true; s.editorRegionSearch = ""; });
            },
            editProduct: (id) => {
                if (id) {
                    const product = state.products.find(p => p.id === id);
                    if (product) {
                        setState(s => { s.view = 'edit'; s.selectedProductId = id; s.viewData = JSON.parse(JSON.stringify(product)); s.isNewProduct = false; s.editorRegionSearch = ""; });
                    }
                } else {
                    setState(s => { s.view = 'edit'; s.isNewProduct = false; s.editorRegionSearch = ""; });
                }
            },
            saveProduct: async () => {
                if (!state.viewData) return;
                try {
                    const colRef = collection(db, COL_PRODUCTS);
                    // region이 없어도 저장 가능하도록 수정하거나, 유효성 검사 추가 가능
                    // if (!state.viewData.region) { showToast("지역을 선택해주세요.", "error"); return; }

                    if (state.isNewProduct) {
                        await addDoc(colRef, { ...state.viewData, createdAt: serverTimestamp(), updatedAt: serverTimestamp() });
                        showToast("등록되었습니다.");
                    } else {
                        await updateDoc(doc(db, COL_PRODUCTS, state.viewData.id), { ...state.viewData, updatedAt: serverTimestamp() });
                        showToast("수정되었습니다.");
                    }

                    if (state.view === 'edit') {
                        if (state.isAdmin) actions.goAdminDashboard();
                        else if (state.isNewProduct) actions.selectRegion(state.viewData.region);
                        else actions.selectProduct(state.viewData.id);
                    }
                } catch (e) { console.error(e); showToast("저장 실패: " + e.message, "error"); }
            },
            initiateDelete: (e, id) => { e.stopPropagation(); setState(s => s.deleteTargetId = id); },
            cancelDelete: () => setState(s => s.deleteTargetId = null),
            executeDelete: async () => {
                if (!state.deleteTargetId) return;
                try {
                    await deleteDoc(doc(db, COL_PRODUCTS, state.deleteTargetId));
                    setState(s => { s.deleteTargetId = null; });
                    if (state.view === 'detail') {
                        if (state.selectedRegion) actions.selectRegion(state.selectedRegion);
                        else actions.goHome();
                    } else if (state.view === 'admin_dashboard') {
                        showToast("삭제되었습니다.");
                    }
                } catch (e) { showToast("삭제 실패", "error"); }
            },

            // [Fix] No render on editor inputs
            updateViewData: (f, v) => setState(s => s.viewData[f] = v, false),
            updatePolicy: (f, v) => setState(s => { if (!s.viewData.policies) s.viewData.policies = {}; s.viewData.policies[f] = v; }, false),
            addOption: () => setState(s => { if (!s.viewData.pricingOptions) s.viewData.pricingOptions = []; s.viewData.pricingOptions.push({ id: Date.now(), name: '', price: 0, unit: '1인' }); }),
            removeOption: (i) => setState(s => s.viewData.pricingOptions.splice(i, 1)),
            updateOption: (i, f, v) => setState(s => s.viewData.pricingOptions[i][f] = v, false),

            addFaq: () => setState(s => { if (!s.viewData.faq) s.viewData.faq = []; s.viewData.faq.push({ q: '', a: '' }); }),
            removeFaq: (i) => setState(s => s.viewData.faq.splice(i, 1)),
            updateFaq: (i, f, v) => setState(s => s.viewData.faq[i][f] = v, false),

            addInputField: () => setState(s => { if (!s.viewData.inputFields) s.viewData.inputFields = []; s.viewData.inputFields.push({ label: '', value: '' }); }),
            removeInputField: (i) => setState(s => s.viewData.inputFields.splice(i, 1)),
            updateInputField: (i, f, v) => setState(s => s.viewData.inputFields[i][f] = v, false),

            setCategory: (c) => setState(s => s.selectedCategory = c),
            updateSearch: (v) => {
                state.searchQuery = v;
                debounceRender();
            },
            toggleSort: () => setState(s => { s.sortMode = s.sortMode === 'recommend' ? 'price_asc' : 'recommend'; showToast(s.sortMode === 'price_asc' ? "최저가순" : "추천순"); }),
            initializeSampleData: async () => {
                if (!confirm("샘플 상품 데이터를 추가하시겠습니까?")) return;
                const colRef = collection(db, COL_PRODUCTS);
                for (const item of INITIAL_SAMPLE_DATA) {
                    const { id, ...data } = item;
                    await addDoc(colRef, { ...data, createdAt: serverTimestamp() });
                }
                showToast("상품 데이터 추가 완료");
            },

            // [New] Editor Region Selection Actions
            updateEditorRegionSearch: (val) => {
                // [FIXED] 자동 완성을 위해 debounceRender 호출
                state.editorRegionSearch = val;
                debounceRender();
            },
            selectEditorRegion: (regionId) => {

                });

            clearEditorRegion: () => {
                setState(s => {

                });
            }
        };

            else if (state.view === 'edit') mainContent = renderEditor();

            const toastHtml = state.toast.show ? `
                <div class="fixed top-10 left-1/2 transform -translate-x-1/2 z-[100] px-6 py-3 rounded-full shadow-xl text-white text-sm font-bold animate-fade-in flex items-center gap-2 ${state.toast.type === 'error' ? 'bg-red-500' : 'bg-gray-800'}">
                    <span class="material-symbols-outlined text-lg">${state.toast.type === 'error' ? 'error' : 'check_circle'}</span> ${state.toast.message}
                </div>` : '';

            const authModal = state.showAuthModal ? `
                <div class="fixed inset-0 bg-black/60 flex items-center justify-center z-[100] px-4 backdrop-blur-sm">
                    <div class="bg-white rounded-2xl p-6 w-full max-w-xs shadow-2xl animate-fade-in">
                        <h3 class="font-bold text-lg mb-1 text-center">관리자 로그인</h3>
                        <input type="password" class="w-full p-3 border rounded-xl text-center mb-3 outline-none focus:border-primary" 
                            autofocus oninput="actions.updatePasswordInput(this.value)" onkeyup="if(event.key==='Enter') actions.handleAdminLogin()">
                        ${state.loginError ? '<p class="text-red-500 text-xs text-center mb-2">비밀번호 오류</p>' : ''}
                        <div class="flex gap-2">
                            <button onclick="actions.toggleAuthModal(false)" class="flex-1 py-3 bg-gray-100 rounded-xl font-bold text-gray-600 text-sm">취소</button>
                            <button onclick="actions.handleAdminLogin()" class="flex-1 py-3 bg-primary text-white rounded-xl font-bold text-sm">확인</button>
                        </div>
                    </div>
                </div>` : '';

            const deleteModal = state.deleteTargetId ? `
                <div class="fixed inset-0 bg-black/60 flex items-center justify-center z-[110] px-4 backdrop-blur-sm">
                    <div class="bg-white rounded-2xl p-6 w-full max-w-xs shadow-2xl text-center animate-fade-in">
                        <h3 class="font-bold text-lg">삭제하시겠습니까?</h3>
                        <div class="flex gap-2 mt-4">
                            <button onclick="actions.cancelDelete()" class="flex-1 py-3 bg-gray-100 rounded-xl font-bold text-gray-600 text-sm">취소</button>
                            <button onclick="actions.executeDelete()" class="flex-1 py-3 bg-red-500 text-white rounded-xl font-bold text-sm">삭제</button>
                        </div>
                    </div>
                </div>` : '';

            app.innerHTML = `${mainContent}${toastHtml}${authModal}${deleteModal}`;
            lucide.createIcons();

            // [2] 렌더링 후 포커스 및 커서 위치 복구
            if (activeId) {
                const el = document.getElementById(activeId);
                if (el) {
                    el.focus();
                    // 입력 요소인 경우 커서 위치 복원
                    if (el.type === 'text' || el.type === 'search' || el.tagName === 'TEXTAREA') {
                        try { el.setSelectionRange(selectionStart, selectionEnd); } catch (e) { }
                    }
                }
            }
        }

        initAuth();
        subscribeToData(); // [변경] 메타데이터 구독
        render();
    </script>
</body>

</html>
